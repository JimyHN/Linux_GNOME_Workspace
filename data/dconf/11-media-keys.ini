[custom-keybindings/custom0]
binding='<Control><Super>minus'
command='gdctl set --logical-monitor --primary --monitor HDMI-3'
name='Pantalla Derecha'

[custom-keybindings/custom1]
binding='<Control><Super>comma'
command='gdctl set --logical-monitor --primary --monitor HDMI-4'
name='Pantalla Izquierda'

[custom-keybindings/custom2]
