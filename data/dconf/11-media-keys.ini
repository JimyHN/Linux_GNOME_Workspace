# dconf-path: /org/gnome/settings-daemon/plugins/media-keys/
# Atajos de teclado. Al añadir o quitar uno hay que renumerar los customN
# sin huecos y dejar la lista custom-keybindings en el mismo orden: GNOME
# ignora las entradas cuya ruta no este listada ahi.
[/]
control-center=['<Super>c']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/']
terminal=['<Super>Return']

[custom-keybindings/custom0]
binding='<Control><Super>period'
command='gdctl set --logical-monitor --primary --monitor HDMI-4 --logical-monitor --monitor HDMI-3 --right-of HDMI-4'
name='Ambas pantallas'

[custom-keybindings/custom1]
binding='<Shift><Super>f'
command='firefox'
name='Firefox'

[custom-keybindings/custom2]
binding='<Shift><Super>b'
command='burpsuite'
name='BurpSuite'
